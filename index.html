<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>KRATOS Arm · WebGPU viewer</title>
<style>
:root {
  --bg0: #0d0f13;
  --bg1: #161a21;
  --panel: rgba(20, 24, 31, 0.78);
  --line: rgba(255, 255, 255, 0.08);
  --text: #e9edf3;
  --dim: #98a2b3;
  --accent: #f2862b;
  --blue: #3d9bff;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg0); color: var(--text); font: 13px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; overflow: hidden; }
button { font: inherit; color: inherit; cursor: pointer; }
code { font: 11.5px ui-monospace, SFMono-Regular, Menlo, monospace; color: #c9d3e1; background: rgba(255,255,255,.06); padding: 1px 4px; border-radius: 4px; }

#app { position: fixed; inset: 0; display: grid; grid-template-columns: 300px 1fr 300px; grid-template-rows: 52px 1fr; }
header { grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; padding: 0 16px; border-bottom: 1px solid var(--line); background: linear-gradient(180deg, #151920, #11141a); z-index: 3; }
.brand { display: flex; align-items: baseline; gap: 10px; white-space: nowrap; }
.brand b { font-size: 15px; letter-spacing: .14em; }
.brand span { color: var(--dim); }
.chip { font-size: 11px; font-weight: 600; letter-spacing: .04em; padding: 3px 8px; border-radius: 999px; background: rgba(94, 224, 143, .14); color: #74e7a2; border: 1px solid rgba(94, 224, 143, .3); }
.chip.warn { background: rgba(255, 210, 61, .12); color: #ffd23d; border-color: rgba(255, 210, 61, .3); }
.spacer { flex: 1; }
.seg { display: flex; background: rgba(255,255,255,.05); border: 1px solid var(--line); border-radius: 9px; padding: 2px; }
.seg button { border: 0; background: transparent; padding: 5px 10px; border-radius: 7px; color: var(--dim); }
.seg button:hover { color: var(--text); }
.seg button[aria-pressed="true"] { background: rgba(255,255,255,.1); color: var(--text); }

#viewport { grid-column: 2; grid-row: 2; position: relative; overflow: hidden; background: radial-gradient(120% 90% at 50% 25%, #252b36 0%, #151920 55%, #0d0f13 100%); touch-action: none; }
#viewport canvas { position: absolute; inset: 0; width: 100% !important; height: 100% !important; display: block; outline: none; }
#labels { position: absolute; inset: 0; pointer-events: none; }
.jlabel { position: absolute; left: 0; top: 0; margin: -22px 0 0 8px; font-size: 10.5px; font-weight: 700; color: #0d0f13; background: var(--c); padding: 1px 6px; border-radius: 6px; box-shadow: 0 2px 8px rgba(0,0,0,.4); will-change: transform; }
#status { position: absolute; inset: 0; display: grid; place-items: center; color: var(--dim); font-size: 14px; padding: 24px; text-align: center; }
#status.error { color: #ffb4a1; }
#tip { position: absolute; pointer-events: none; background: rgba(12, 14, 18, .92); border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; display: grid; gap: 1px; max-width: 260px; z-index: 4; }
#tip span { color: var(--dim); font-size: 12px; }

.dock { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); display: flex; align-items: center; gap: 12px; padding: 8px 12px; background: var(--panel); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.35); white-space: nowrap; z-index: 2; }
.dock label { color: var(--dim); font-size: 12px; }
.btn { border: 1px solid var(--line); background: rgba(255,255,255,.06); padding: 6px 12px; border-radius: 9px; }
.btn:hover { background: rgba(255,255,255,.1); }
.btn.on, .btn.primary { background: var(--accent); border-color: transparent; color: #1a0f05; font-weight: 600; }
.tog { border: 1px solid var(--line); background: transparent; color: var(--dim); padding: 5px 9px; border-radius: 9px; font-size: 12px; }
.tog[aria-pressed="true"] { color: var(--text); background: rgba(61, 155, 255, .16); border-color: rgba(61, 155, 255, .45); }

aside { grid-row: 2; background: linear-gradient(180deg, #13161c, #0f1216); border-right: 1px solid var(--line); overflow: auto; z-index: 2; }
aside.right { border-right: 0; border-left: 1px solid var(--line); display: flex; flex-direction: column; }
.sec { padding: 14px 14px 10px; border-bottom: 1px solid var(--line); }
.sec h2 { margin: 0 0 10px; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); display: flex; align-items: center; gap: 8px; }
.sec h2 .spacer { flex: 1; }
.row { display: flex; gap: 6px; flex-wrap: wrap; }

.joint { padding: 9px 10px 8px; margin: 0 0 8px; border-radius: 11px; background: rgba(255,255,255,.035); border: 1px solid var(--line); }
.joint:hover { border-color: color-mix(in srgb, var(--c) 45%, transparent); }
.jhead { display: flex; align-items: center; gap: 8px; }
.jid { font-weight: 700; font-size: 11px; color: #0d0f13; background: var(--c); border-radius: 6px; padding: 1px 6px; }
.jname { flex: 1; font-weight: 600; }
.jval { width: 62px; text-align: right; background: rgba(0,0,0,.25); border: 1px solid var(--line); color: var(--text); border-radius: 6px; padding: 2px 5px; font: 12px ui-monospace, Menlo, monospace; }
.deg { color: var(--dim); margin-left: -4px; }
.jmeta { display: flex; justify-content: space-between; color: var(--dim); font-size: 11px; margin-top: 2px; }
.jsrc { opacity: .75; }

input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 22px; background: transparent; margin: 4px 0 0; --p: 50%; --z: 50%; }
input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 4px; background: linear-gradient(90deg, rgba(255,255,255,.14) 0 calc(var(--z) - 1px), rgba(255,255,255,.55) calc(var(--z) - 1px) calc(var(--z) + 1px), rgba(255,255,255,.14) calc(var(--z) + 1px)); }
input[type=range]::-moz-range-track { height: 4px; border-radius: 4px; background: rgba(255,255,255,.14); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; margin-top: -6px; border-radius: 50%; background: var(--c, var(--accent)); border: 2px solid #0d0f13; box-shadow: 0 0 0 1px var(--c, var(--accent)); }
input[type=range]::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: var(--c, var(--accent)); border: 2px solid #0d0f13; }
#explode { width: 180px; --c: var(--accent); }

.pgroup { border-bottom: 1px solid var(--line); }
.pgroup summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px; padding: 8px 14px; font-weight: 600; }
.pgroup summary::-webkit-details-marker { display: none; }
.pgroup summary::before { content: '▸'; color: var(--dim); font-size: 10px; transition: transform .15s; }
.pgroup[open] summary::before { transform: rotate(90deg); }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c); flex: none; }
.badge { font-size: 10.5px; color: var(--dim); border: 1px solid var(--line); border-radius: 5px; padding: 0 5px; }
.count { margin-left: auto; color: var(--dim); font-weight: 400; font-size: 12px; }
.prow { display: flex; align-items: center; gap: 6px; padding: 3px 14px 3px 30px; color: #cfd6e2; }
.prow:hover { background: rgba(255,255,255,.04); }
.prow.sel { background: rgba(61, 155, 255, .16); color: #fff; }
.prow.hidden .pname { opacity: .35; text-decoration: line-through; }
.pname { flex: 1; cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.eye { width: 18px; height: 18px; border: 0; background: none; padding: 0; opacity: .55; position: relative; }
.eye::before { content: ''; position: absolute; inset: 4px 2px; border: 1.5px solid currentColor; border-radius: 50% / 60%; }
.eye::after { content: ''; position: absolute; left: 7px; top: 7px; width: 4px; height: 4px; border-radius: 50%; background: currentColor; }
.prow.hidden .eye { opacity: .25; }
.eye:hover { opacity: 1; }
.dup { font-size: 10px; color: #ffd23d; border: 1px solid rgba(255,210,61,.35); border-radius: 4px; padding: 0 4px; }
#parts-scroll { overflow: auto; flex: 1; min-height: 120px; }

#info { margin: 10px; padding: 12px; border-radius: 12px; background: rgba(61, 155, 255, .08); border: 1px solid rgba(61, 155, 255, .3); }
.ihead { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.ihead b { flex: 1; }
.x { border: 0; background: none; color: var(--dim); font-size: 18px; line-height: 1; padding: 0 2px; }
#info dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; margin: 0; font-size: 12px; }
#info dt { color: var(--dim); }
#info dd { margin: 0; overflow-wrap: anywhere; }
.warn { color: #ffd98a; font-size: 12px; margin: 8px 0 0; }
.iactions { display: flex; gap: 6px; margin-top: 10px; }
.iactions button { flex: 1; border: 1px solid var(--line); background: rgba(255,255,255,.06); border-radius: 8px; padding: 5px; }

details.spec summary { cursor: pointer; color: var(--dim); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; list-style: none; }
details.spec summary::-webkit-details-marker { display: none; }
#joint-table { width: 100%; border-collapse: collapse; font-size: 11.5px; margin-top: 10px; }
#joint-table th { text-align: left; color: var(--dim); font-weight: 500; padding: 4px 4px; border-bottom: 1px solid var(--line); }
#joint-table td { padding: 6px 4px; border-bottom: 1px solid var(--line); vertical-align: top; }
#joint-table td:first-child { border-left: 3px solid var(--c); padding-left: 7px; }
#joint-table small { display: block; color: var(--dim); }
#model-notes { color: var(--dim); font-size: 12px; }
#model-notes p { margin: 8px 0; }
.hint { color: var(--dim); font-size: 11.5px; margin-top: 8px; }

@media (max-width: 1100px) {
  #app { grid-template-columns: 270px 1fr 260px; }
  #joint-table { font-size: 11px; }
}
@media (max-width: 820px) {
  #app { grid-template-columns: 1fr; grid-template-rows: 48px 1fr 42vh; }
  header { gap: 8px; padding: 0 10px; overflow-x: auto; }
  .brand span { display: none; }
  #viewport { grid-column: 1; grid-row: 2; }
  aside.left, aside.right { grid-row: 3; grid-column: 1; border: 0; border-top: 1px solid var(--line); display: none; }
  body[data-tab="joints"] aside.left, body[data-tab="parts"] aside.right { display: flex; flex-direction: column; }
  .tabs { display: flex !important; }
  .dock { bottom: 10px; gap: 8px; padding: 6px 8px; max-width: calc(100% - 20px); overflow-x: auto; }
  #explode { width: 110px; }
  .hide-sm { display: none; }
}
body.bare #app { grid-template-columns: 0 1fr 0; }
body.bare aside, body.bare .dock, body.bare header .seg { display: none; }
.tabs { display: none; position: absolute; top: 10px; left: 50%; transform: translateX(-50%); z-index: 3; }
</style>
</head>
<body data-tab="joints">
<div id="app">
  <header>
    <div class="brand"><b>KRATOS</b><span>Arm · 6-axis · 60 parts</span></div>
    <span id="backend" class="chip">WebGPU</span>
    <div class="spacer"></div>
    <div class="seg hide-sm" role="group" aria-label="Camera views">
      <button data-view="iso">Iso</button><button data-view="front">Front</button><button data-view="side">Side</button><button data-view="top">Top</button><button data-view="back">Back</button>
    </div>
    <div class="seg" role="group" aria-label="Drag on the model">
      <button data-drag="orbit" aria-pressed="true" title="Drag to orbit the camera">Orbit</button>
      <button data-drag="pose" aria-pressed="false" title="Drag a part to turn the joint that moves it (or hold Alt in Orbit)">Pose</button>
    </div>
  </header>

  <aside class="left">
    <div class="sec">
      <h2>Joints<span class="spacer"></span></h2>
      <div id="joint-list"></div>
      <div class="row">
        <button id="home" class="btn">Home</button>
        <button id="random" class="btn">Random pose</button>
        <button id="play" class="btn">Play motion</button>
      </div>
      <p class="hint">Drag a slider, type an angle, or switch to Pose and drag the arm itself. Double-click a joint name to send it home.</p>
    </div>
    <div class="sec">
      <h2>Display</h2>
      <div class="row">
        <button class="tog" data-toggle="axes">Joint axes</button>
        <button class="tog" data-toggle="limits">Limits</button>
        <button class="tog" data-toggle="xray">X-ray</button>
        <button class="tog" data-toggle="cad">CAD colours</button>
        <button class="tog" data-toggle="autorotate">Turntable</button>
      </div>
    </div>
    <div class="sec">
      <details class="spec" open>
        <summary>Joint table ▾</summary>
        <table id="joint-table"></table>
      </details>
    </div>
    <div class="sec">
      <details class="spec">
        <summary>About this model ▾</summary>
        <div id="model-notes"></div>
      </details>
    </div>
  </aside>

  <main id="viewport">
    <div id="labels"></div>
    <div id="status">Starting WebGPU…</div>
    <div id="tip" hidden></div>
    <div class="seg tabs" role="tablist">
      <button aria-pressed="true" data-tab="joints">Joints</button>
      <button aria-pressed="false" data-tab="parts">Parts</button>
    </div>
    <div class="dock">
      <button id="explode-toggle" class="btn">Explode</button>
      <label for="explode">Spread</label>
      <input id="explode" type="range" min="0" max="1" step="0.01" value="0">
    </div>
  </main>

  <aside class="right">
    <div class="sec">
      <h2>Parts<span class="spacer"></span><button id="show-all" class="tog">Show all</button></h2>
    </div>
    <div id="parts-scroll"><div id="part-list"></div></div>
    <div id="info" hidden></div>
  </aside>
</div>
<script>
document.querySelectorAll('.tabs button').forEach(function (b) {
  b.addEventListener('click', function () {
    document.body.dataset.tab = b.dataset.tab;
    document.querySelectorAll('.tabs button').forEach(function (o) { o.setAttribute('aria-pressed', String(o === b)); });
  });
});
</script>
<script src="model.js"></script>
<script src="main.js"></script>
</body>
</html>
